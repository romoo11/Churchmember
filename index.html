<!DOCTYPE html>
<!--
  성산교회 교인관리 → 교우이음 주소 변경 안내
  이 파일을 romoo11/Churchmember 저장소의 index.html 로 올립니다.
  들어오는 분을 몇 초 뒤 새 주소로 자동으로 보냅니다.
  © 2026 교회이음 · 무단 복제 및 재배포 금지
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주소가 바뀌었습니다 · 교우이음</title>
<meta name="robots" content="noindex">
<!-- 자바스크립트가 꺼진 기기도 넘어가도록 -->
<noscript><meta http-equiv="refresh" content="4; url=https://romoo11.github.io/churchieum/"></noscript>
<style>
  :root{--navy:#16223D;--gold:#C9A227;--ink:#1d2b3a;--sub:#5e6b78}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background:linear-gradient(180deg,#1c2d50 0%,var(--navy) 100%);color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:28px 24px 22px;
    box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center}
  .badge{display:inline-block;background:#F6E7B8;color:#7A5B12;font-weight:700;font-size:13px;
    border-radius:999px;padding:4px 12px;margin-bottom:14px}
  h1{font-size:23px;line-height:1.35;color:var(--navy);margin-bottom:10px}
  p{font-size:15px;line-height:1.65;color:var(--sub)}
  .addr{margin:18px 0 6px;background:#F3F6FA;border:1px solid #DDE4EC;border-radius:12px;padding:12px 10px}
  .addr small{display:block;font-size:12px;color:#7b8794;margin-bottom:3px}
  .addr b{font-size:16.5px;color:var(--navy);word-break:break-all}
  .go{display:block;margin:18px 0 8px;padding:14px;border-radius:12px;text-decoration:none;
    font-weight:700;font-size:17px;color:#33280B;border:1px solid #8C6C1E;
    background:linear-gradient(180deg,#EBD9A4 0%,#D3B159 44%,#B8912F 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 5px rgba(0,0,0,.2)}
  .count{font-size:13px;color:#8a94a3;min-height:18px}
  .same{margin-top:16px;text-align:left;background:#FBF8EE;border-radius:12px;padding:12px 14px}
  .same li{font-size:14px;line-height:1.6;color:#4a5563;margin-left:18px}
  .same li b{color:var(--ink)}
  .foot{margin-top:16px;font-size:11.5px;color:#9aa4b1}
</style>
</head>
<body>
  <main class="card">
    <div class="badge">주소 변경 안내</div>
    <h1>성산교회 교인관리가<br>‘교우이음’으로 옮겨졌습니다</h1>
    <p>계정·권한·기록은 모두 그대로입니다.<br>잠시 뒤 새 주소로 자동으로 이동합니다.</p>

    <div class="addr"><small>새 주소</small><b>romoo11.github.io/churchieum</b></div>

    <a class="go" id="go" href="https://romoo11.github.io/churchieum/">지금 새 주소로 가기</a>
    <div class="count" id="count"></div>

    <ul class="same">
      <li><b>로그인</b> — 쓰시던 이메일·비밀번호 그대로</li>
      <li><b>휴대폰 아이콘</b> — 옛 아이콘을 지우고, 새 주소에서 다시 ‘홈 화면에 추가’해 주세요</li>
    </ul>

    <div class="foot">© 2026 교회이음</div>
  </main>

<script>
  (function(){
    var NEW_URL = "https://romoo11.github.io/churchieum/";
    var left = 3;
    var el = document.getElementById("count");
    function tick(){
      if(left <= 0){
        /* 뒤로 가기를 눌러도 이 안내로 되돌아오지 않도록 replace 를 씁니다 */
        try{ window.location.replace(NEW_URL); }catch(e){ window.location.href = NEW_URL; }
        return;
      }
      if(el) el.textContent = left + "초 뒤 자동으로 이동합니다";
      left -= 1;
      setTimeout(tick, 1000);
    }
    tick();
  })();
</script>
</body>
</html>
