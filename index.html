<title>교인 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F4F5F8; --card:#FFFFFF; --ink:#1E2635; --muted:#63708A;
    --pine:#22355C; --pine-deep:#16223D; --pine-soft:#E3E8F2;
    --gold:#C29B3C; --gold-soft:#F4EAD2;
    --blue:#3D5A80; --clay:#A8442F; --clay-soft:#F4E2DC;
    --line:#D3D9E4;
  }
  /* 부서·속 머리표 (아이콘 배지) */
  .dept-head{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;border-radius:12px;
    color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.10);margin-bottom:10px}
  .dept-head .ico{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.24);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
  .dept-head .nm{font-family:"Gowun Batang","Noto Sans KR",serif;font-size:17px;font-weight:700}
  .dept-head .ct{background:rgba(255,255,255,.22);border-radius:999px;padding:1px 10px;font-size:12.5px}
  .dept-head .sp{margin-left:auto;display:flex;gap:6px}
  .dept-head button{border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:4px 11px;
    background:linear-gradient(180deg,#FFFFFF 0%,#EEF2F8 55%,#DDE4EF 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 1px 3px rgba(0,0,0,.22);
    font-size:13px;color:#1E2635;font-weight:600}
  .dept-head button:hover{background:#fff}
  /* 반 머리표 */
  .cls-head{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 13px;border-radius:11px;
    border:1px solid #BFCADE;border-left:5px solid var(--pine);
    background:linear-gradient(180deg,#F4F7FC 0%,#E6ECF6 55%,#D9E1EE 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 3px rgba(34,53,92,.10)}
  .cls-head .nm{font-weight:700;font-size:15px;color:var(--pine-deep)}
  .cls-head .ct{color:var(--muted);font-size:12.5px}
  .cls-head .btn.sm{margin-left:auto}
  .cls-head.none{background:#EBEEF4;border-left-color:#AEB6C6}
  .cls-head.none .nm{color:#63708A}
  .chip.secret{background:#7E2F20;color:#fff}
  td.nw, th.nw{white-space:nowrap}
  .able{margin-top:5px;white-space:normal;max-width:280px;line-height:1.5}
  .able span{display:block;font-size:11.5px}
  .able-yes{color:var(--pine)}
  .able-no{color:#8A6A2E}
  .scope-col{min-width:230px}
  .scope-row{display:flex;align-items:center;gap:5px;margin-bottom:5px}
  .scope-row .chip{white-space:nowrap}
  .scope-col select{max-width:230px}
  .svc-add{border:1.5px dashed #7A8CB0;border-radius:999px;padding:7px 15px;
    font-weight:600;color:var(--pine);text-shadow:0 1px 0 rgba(255,255,255,.85);
    background:linear-gradient(180deg,#FFFFFF 0%,#F2F5FA 48%,#E2E8F2 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 4px rgba(34,53,92,.10)}
  .svc-add:hover{filter:brightness(1.04)}
  .svc-past{border:1px solid #C3CBDB;border-radius:999px;padding:7px 15px;
    font-weight:600;color:var(--muted);text-shadow:0 1px 0 rgba(255,255,255,.8);
    background:linear-gradient(180deg,#FAFBFD 0%,#EBEEF5 48%,#DDE2EC 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 4px rgba(34,53,92,.10)}
  .svc-past:hover{filter:brightness(1.04)}
  .sp-past-box{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#EDEFF5;
    border-radius:10px;padding:10px 14px;margin-bottom:12px}
  .sp-note{display:flex;align-items:center;gap:8px;background:#F1EDF6;border-left:5px solid #7B5EA7;
    border-radius:10px;padding:9px 14px;margin-bottom:12px;flex-wrap:wrap}
  /* 시작 화면 */
  .gate{position:fixed;inset:0;z-index:50;background:#153161;overflow:hidden;
    display:flex;align-items:center;justify-content:center}
  .gate-art{position:relative;line-height:0;flex:0 0 auto;
    width:min(100vw, calc(100vh * 1448 / 1086));aspect-ratio:1448 / 1086}
  .gate-art img{display:block;width:100%;height:100%}
  /* 로고 아래 빈 자리 (60% ~ 90%) */
  .gate-over{position:absolute;left:0;right:0;top:61%;
    display:flex;flex-direction:column;align-items:center;line-height:1.35;text-align:center}
  .gate-church{font-family:"Gowun Batang","Noto Sans KR",serif;color:#fff;font-weight:700;
    font-size:clamp(17px,2.5vw,32px);letter-spacing:1px;
    text-shadow:0 2px 10px rgba(0,0,0,.45)}
  .gate-app{margin-top:.35em;font-family:"Gowun Batang","Noto Sans KR",serif;
    color:#C7D6EE;font-size:clamp(12px,1.55vw,20px);letter-spacing:7px;
    text-indent:7px;font-weight:700}
  .gate-tag{margin-top:.5em;color:#93A8C9;font-size:clamp(9px,1.05vw,13.5px);
    letter-spacing:.3px}
  .gate-btn{margin-top:1.5em;background:rgba(255,255,255,.10);color:#fff;
    border:1.5px solid rgba(255,255,255,.8);border-radius:999px;
    padding:0.72em 2.6em;font-size:clamp(11px,1.35vw,17px);font-weight:700;letter-spacing:2px;
    font-family:"Gowun Batang","Noto Sans KR",serif;line-height:1;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    box-shadow:0 4px 16px rgba(0,0,0,.3);transition:background .15s, transform .08s}
  .gate-btn:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
  .gate-btn:active{transform:translateY(1px)}
  .gate-foot{position:absolute;left:0;right:0;bottom:4%;text-align:center;
    color:#7E93B6;font-size:clamp(8px,.92vw,12px);line-height:1.8}
  .gate-foot b{color:#B9C9E4;font-family:"Gowun Batang","Noto Sans KR",serif;letter-spacing:1.5px}
  /* 세로 화면에서는 가운데를 키워 글씨가 읽히게 */
  /* 글씨는 화면 밖으로 나가지 않게 */
  .gate-church,.gate-app,.gate-tag,.gate-btn{max-width:90vw}
  .gate-tag{padding:0 4px}
  .gate-foot{padding:0 10px}
  @media (max-aspect-ratio: 1/1){
    .gate-art{width:min(205vw, calc(100vh * 1448 / 1086))}
    .gate-church{font-size:clamp(19px,5.4vw,30px)}
    .gate-app{font-size:clamp(13px,3.4vw,20px);letter-spacing:5px;text-indent:5px}
    .gate-tag{font-size:clamp(10px,2.5vw,14px)}
    .gate-btn{font-size:clamp(12px,3vw,16px);margin-top:1.2em}
    .gate-foot{font-size:clamp(9px,2.1vw,12px);bottom:6%}
  }
  .app-copy{display:flex;align-items:center;justify-content:center;gap:10px;
    color:var(--muted);font-size:11.5px;padding:26px 12px 34px;line-height:1.6;text-align:left}
  .app-copy span{opacity:.75}
  /* 교회별 홈 사진: 공통 배경과 교회 사진을 분리 */
  .church-home-banner{aspect-ratio:1400/787;container-type:inline-size}
  .church-home-background{display:block;width:100%;height:100%;object-fit:cover}
  .church-photo-slot.cut-out{background:none;border:none;box-shadow:none}
  .church-photo-slot.cut-out::after{display:none}
  .cut-white{display:flex;align-items:center;gap:8px;margin:10px 0 2px;
    font-size:14px;color:var(--ink);cursor:pointer}
  .cut-white input{width:17px;height:17px;accent-color:var(--pine)}
  .church-photo-slot{position:absolute;left:2.6%;top:18%;width:25.5%;height:59%;
    overflow:hidden;border-radius:14px;
    border:1px solid rgba(34,53,92,.32);
    background:linear-gradient(180deg,#FFFFFF 0%,#EFF3F9 46%,#DCE3EF 100%);

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);

  .top-in{max-width:1320px;margin:0 auto;padding:10px 14px;
    display:flex;flex-wrap:nowrap;align-items:center;gap:10px}

  .top-in > .back-btn{flex:0 0 auto}
  .top-in > nav{flex:1 1 auto;min-width:0}

  .brand{font-family:"Gowun Batang",serif;font-weight:700;font-size:18px;
    display:flex;align-items:center;gap:7px;white-space:nowrap}
  .brand svg{flex:none}
  .brand button{background:none;border:none;color:inherit;font:inherit;padding:0;text-align:left}
  .brand button:hover{text-decoration:underline}

    border-radius:8px;-webkit-tap-highlight-color:transparent}

  .back-btn{color:#EEF1F7;padding:6px 12px;border-radius:11px;font-size:14px;font-weight:600;
    white-space:nowrap;border:1px solid rgba(255,255,255,.26);
    background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.12) 45%,rgba(255,255,255,.04) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.32), 0 1px 3px rgba(0,0,0,.28)}

  nav{display:flex;gap:2px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;
    scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{white-space:nowrap}
  .top-right{display:flex;gap:4px;align-items:center;white-space:nowrap}
  /* 화면이 좁아질수록 조금씩 더 줄여 한 줄을 지킨다 */
  nav button{background:none;border:1px solid transparent;color:#CFDDD6;padding:7px 10px;
    border-radius:11px;font-weight:500;font-size:14.5px;
    transition:filter .12s, transform .08s, background .12s}
  nav button:not(.on):hover{background:rgba(255,255,255,.12);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
  nav button:active{transform:translateY(1px)}
  nav button.on{color:#33280B;font-weight:700;border:1px solid #8C6C1E;
    text-shadow:0 1px 0 rgba(255,255,255,.42);
    background:linear-gradient(180deg,#EBD9A4 0%,#D3B159 44%,#B8912F 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 4px rgba(0,0,0,.18),
      0 2px 4px rgba(0,0,0,.24)}
  .backup-btn{color:#EEF1F7;padding:6px 11px;border-radius:11px;font-size:13px;white-space:nowrap;
    border:1px solid rgba(255,255,255,.24);
    background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.11) 46%,rgba(255,255,255,.03) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.34), 0 1px 3px rgba(0,0,0,.30);
    transition:filter .12s, transform .08s}
  .backup-btn:hover{filter:brightness(1.25)}
  .backup-btn:active{transform:translateY(1px)}
  @media (max-width:1240px){
    .top-in{gap:8px;padding:9px 12px}
    .brand{font-size:17px}
    nav button{padding:7px 8px;font-size:14px}
    .backup-btn{padding:5px 9px;font-size:12.5px}
    .back-btn{padding:6px 10px;font-size:13.5px}
  }
  @media (max-width:1080px){
    .brand{font-size:15.5px;gap:6px}
    .brand svg{width:22px;height:22px}
    nav button{padding:6px 7px;font-size:13.5px}
    .backup-btn{padding:5px 8px;font-size:12px}
    .back-btn{padding:5px 9px;font-size:13px}
    .top-in{gap:6px}
  }
  @media (max-width:860px){
    .brand button{max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    nav button{padding:6px 6px;font-size:13px}
  }

  .hero{position:relative;border-radius:16px;overflow:hidden;margin:20px 0 22px;

  /* 물방울(광택) 단추 — 위는 밝고 아래는 짙게, 안쪽 위에 흰 하이라이트 */
  .btn{color:#fff;border:1px solid #1B2C4E;border-radius:13px;padding:9px 17px;font-weight:600;
    background:linear-gradient(180deg,#5A7FB4 0%,#2E4E82 42%,#22355C 100%);

      0 2px 5px rgba(22,34,61,.28);
    text-shadow:0 1px 1px rgba(0,0,0,.28);transition:filter .12s, transform .08s, box-shadow .12s}
  .btn:hover{filter:brightness(1.09)}
  .btn:active{transform:translateY(1px);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.32), 0 1px 2px rgba(22,34,61,.25)}
  .btn.gold{color:#33280B;border-color:#8C6C1E;text-shadow:0 1px 0 rgba(255,255,255,.35);
    background:linear-gradient(180deg,#EBD9A4 0%,#D3B159 42%,#B8912F 100%)}

      0 2px 5px rgba(34,53,92,.14)}

      0 2px 5px rgba(142,56,38,.14)}
  .btn.sm{padding:5px 12px;font-size:13.5px;border-radius:10px}

/* 교인 사진: 선택한 이미지 파일을 작게 압축해 base64 문자열로 변환 */
const readPhoto = (file) => new Promise((resolve, reject)=>{
  const r = new FileReader();
  r.onerror = () => reject(new Error("read"));
  r.onload = () => {
    const img = new Image();
    img.onerror = () => reject(new Error("img"));
    img.onload = () => {
      const max = 480;
      let w = img.width, h = img.height;
      const scale = Math.min(1, max / Math.max(w, h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});

  const b = new Date(birth + "T00:00:00"); if (isNaN(b)) return null;
  const t = new Date(); let a = t.getFullYear() - b.getFullYear();
  if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
  return a;
};
const fmtDT = v => {

const koSort = (a, b) => (a.name || "").localeCompare(b.name || "", "ko");
const errMsg = e => (e && e.message) ? e.message : "알 수 없는 오류";

/* ═══ 교회마다 다를 수 있는 값들 — 설정 화면에서 바꿉니다 ═══ */
let SERVICES = [
  {key:"sun", label:"주일예배", dow:0},
  {key:"wed", label:"수요예배", dow:3},
  {key:"fri", label:"금요기도회", dow:5},

];
let POSITIONS = ["담임목사","부목사","전도사","사모","원로 장로","장로","원로 권사","권사","원로 집사","안수집사","집사","성도","청년","학생","새가족","소천"];
/* 소천하신 분 — 출석 명단에서 제외 (명부에는 그대로 남음) */
const isDeceased = m => (m && m.position) === "소천" || /소천/.test((m && m.memo) || "");
const PURPOSES = ["정기심방","새가족심방","환우심방","경조사","상담","전도","기도","기타"];
const RELATIONS = ["남편","아내","배우자","아들","딸","자녀","며느리","사위","손자","손녀","외손자","외손녀","조카","아버지","어머니","할아버지","할머니","형","오빠","누나","언니","남동생","여동생","형제","자매","삼촌","고모","이모","외삼촌","기타"];

};
const uid2 = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* 부서·속별 색과 아이콘 */
const DEPT_STYLE = {

const SOK_STYLE = {
  "남1":{bg:"linear-gradient(135deg,#22355C,#16223D)"},

  "여1":{bg:"linear-gradient(135deg,#A8442F,#7E2F20)"},
  "여2":{bg:"linear-gradient(135deg,#B4553C,#8A3A28)"},
  "여3":{bg:"linear-gradient(135deg,#BE6647,#95462F)"},
  "여4":{bg:"linear-gradient(135deg,#C29B3C,#9A7828)"},

const headStyle = key => {
  if(!key) return {background:"linear-gradient(135deg,#7A869C,#59637A)", ico:"•"};
  const k = String(key);
  if(k === "MIN") return {background:"linear-gradient(135deg,#B8912F,#8C6C1E)", ico:"✝"};

/* 교회학교 부서 (현재 나이 기준). 이 나이대는 속별 명부에서 제외됨 */
let SCHOOL_DEPTS = [
  {key:"kinder", label:"유치부 (5~7세)", min:5, max:7},
  {key:"child", label:"아동부 (8~13세)", min:8, max:13},

];
/* 교회학교 최고 나이 이하는 속 편성에서 제외 (현재 29세 이하) */
const schoolMaxAge = () => Math.max(...SCHOOL_DEPTS.map(s=>s.max));

let MINISTERS = ["담임목사","부목사","전도사"];   /* 교역자 — 속·부서와 별도로 묶음 */
const isMinister = m => MINISTERS.includes(m && m.position);
const isSamo = m => (m && m.position) === "사모";   /* 사모 — 속회와 별도 항목 */
/* 청년(직분이 '청년'이거나 메모에 청년부)은 나이와 상관없이 청년부 */
const isYoungAdult = m => (m && m.position) === "청년" || /청년부/.test((m && m.memo) || "");

/* 속 편성 방식
   "age"    = 나이·성별로 자동
   "manual" = 속 이름을 만들고 사람마다 지정
   "area"   = 주소에 든 지역 이름으로 자동 (사람마다 직접 지정도 가능) */
let SOK_MODE = "age";
/* 직접 지정·주소 방식일 때 쓰는 속 목록 [{id, name, areas:["화곡1동","화곡2동"]}] */
let SOK_LIST = [];

let SOK_F = [[1948,1],[1954,2],[1958,3],[1962,4],[1968,5],[1973,6],[9999,7]];
let SOK_M = [[1954,1],[1967,2],[9999,3]];   /* 1남 ~1954 · 2남 1955~1967 · 3남 1968~ */

/* 지금 설정을 그대로 꺼내기 (설정 화면에서 사용) */
const currentChurchConfig = () => ({
  sokMode: SOK_MODE,
  sokList: SOK_LIST.map(s=>({...s})),
  services: SERVICES.map(s=>({...s})),
  positions: [...POSITIONS],
  ministers: [...MINISTERS],
  depts: SCHOOL_DEPTS.map(d=>({...d})),
  sokF: SOK_F.map(x=>[...x]),
  sokM: SOK_M.map(x=>[...x]),
});
/* 설정을 프로그램에 적용 */
const applyChurchConfig = (c) => {
  if(!c) return;
  if(c.sokMode === "age" || c.sokMode === "manual") SOK_MODE = c.sokMode;
  if(Array.isArray(c.sokList)) SOK_LIST = c.sokList;
  if(Array.isArray(c.services) && c.services.length) SERVICES = c.services;
  if(Array.isArray(c.positions) && c.positions.length) POSITIONS = c.positions;
  if(Array.isArray(c.ministers)) MINISTERS = c.ministers;
  if(Array.isArray(c.depts) && c.depts.length) SCHOOL_DEPTS = c.depts;
  if(Array.isArray(c.sokF) && c.sokF.length) SOK_F = c.sokF;
  if(Array.isArray(c.sokM) && c.sokM.length) SOK_M = c.sokM;
};
/* 속 개수에 맞춰 이름표 만들기 */
const sokCount = g => (g==="여" ? SOK_F : SOK_M).length;
/* 설정된 속 개수에 맞춘 키 목록: 남1..남n, 여1..여m */
const sokKeys = () => SOK_MODE === "manual"
  ? SOK_LIST.map(s=>s.id)
  : [ ...SOK_M.map((_,i)=>"남"+(i+1)), ...SOK_F.map((_,i)=>"여"+(i+1)) ];
/* 키 하나의 이름표 */
const sokKeyLabel = k => SOK_MODE === "manual"
  ? ((SOK_LIST.find(s=>s.id===k)||{}).name || "속 미지정")
  : sokLabel({g:k[0], n:Number(k.slice(1))});
function sokOf(m){
  if(isMinister(m) || isSamo(m) || isYoungAdult(m)) return null;   /* 교역자·사모·청년은 속 편성 제외 */

  if(SOK_MODE === "manual" || SOK_MODE === "area"){
    /* 사람에게 직접 지정한 속이 있으면 그것이 우선 */
    const id = m && m.sok;
    if(id && SOK_LIST.some(s=>s.id===id)) return {id};
    /* 주소 방식이면 주소에 든 지역 이름으로 찾음 */
    if(SOK_MODE === "area"){
      const addr = normArea(m && m.address);
      if(addr){
        for(const s of SOK_LIST){
          for(const a of (s.areas||[])){
            const key = normArea(a);
            if(key && addr.indexOf(key) >= 0) return {id:s.id};
          }
        }
      }
    }
    return null;
  }

  /* 메모에 속이 적혀 있으면 나이보다 먼저 따릅니다 (10속 넘는 교회도 가능) */
  const memo = m.memo || "";
  const fromMemo = (g) => {
    const hits = [...memo.matchAll(new RegExp("([0-9]{1,3})\\s*" + g + "선교회", "g"))];
    for(const h of hits){
      const n = Number(h[1]);
      if(n >= 1 && n <= sokCount(g)) return {g, n};   /* 설정된 속 수 안에 있을 때만 */
    }
    return null;
  };
  const memoF = fromMemo("여"); if(memoF) return memoF;
  const memoM = fromMemo("남"); if(memoM) return memoM;
  const y = m.birth ? Number(m.birth.slice(0,4)) : 0;
  if(y){
    const ka = koAge(m.birth);
    if(ka !== null && ka <= schoolMaxAge()) return null;   /* 교회학교(유치부~청년부) 대상은 속 편성 제외 */
    if(m.gender==="여"){ for(const p of SOK_F){ if(y<=p[0]) return {g:"여", n:p[1]}; } }
    if(m.gender==="남"){ for(const p of SOK_M){ if(y<=p[0]) return {g:"남", n:p[1]}; } }
  }
  return null;
}
/* 주소 비교용으로 정리: 공백 제거, '화곡제1동' → '화곡1동' 같은 표기 차이 흡수 */
const normArea = t => {
  if(!t) return "";
  return String(t)
    .replace(/\s+/g, "")
    .replace(/제([0-9]+)(동|가|구역)/g, "$1$2")
    .toLowerCase();
};
const sokLabel = s => {
  if(!s) return "속 미지정";
  if(s.id){ const f = SOK_LIST.find(x=>x.id===s.id); return f ? f.name : "속 미지정"; }
  return `${s.g}자 ${s.n}속 (${s.n}${s.g}선교회)`;
};
/* 현재 나이로 교회학교 부서 찾기 */
/* 한 사람이 속한 편성 구분: 남1~3, 여1~7, 교회학교 부서, 그 외 */
const scopeKeyOf = m => {
  if(isMinister(m)) return "MIN";
  if(isSamo(m)) return "SAMO";
  const s = sokOf(m);
  if(s) return s.id ? s.id : s.g + s.n;
  const d = schoolDeptOf(m);
  if(d) return "S_" + d.key;
  return "zz";
};
/* 미소속 방문자 자리 — 등록하지 않은 분이 예배에 오셨을 때 인원만 세기 위한 칸 */
const GUESTS = Array.from({length:10}, (_,i)=>({
  id: "guest-" + (i+1), name: "무명" + (i+1), position: "방문", birth: "", gender: "",
  memo: "", photo: "", family: [], depts: [], visits: [], prayers: [], guest: true
}));

const ATT_ONLY = "ATT_ONLY";   /* 예배 출석 체크만 (성도 전체 · 교회학교 제외) */
const CARE_ALL = "CARE_ALL";   /* 심방·긴밀 기도 전체 보기 */
const PASTOR   = "PASTOR";     /* 교역자 — 성도·교회학교 전체 열람·수정 */
const ELDER    = "ELDER";      /* 장로 — 성도·교회학교 전체 열람만 */
const ROLE_SCOPES = [PASTOR, ELDER, CARE_ALL];
const SCOPE_LIST = () => [
  [PASTOR, "교역자 — 성도·교회학교 전체 열람·수정"],
  [ELDER, "장로 — 성도·교회학교 전체 열람만 (수정 불가)"],
  [CARE_ALL, "심방·긴밀 기도 전체 보기"],
  [ATT_ONLY, "예배 출석 체크만 (성도 전체 · 교회학교 제외)"],
  ["SOK_ALL", "속 전체 (남·여 모든 속)"],
  ["SOK_F_ALL", "여선교회 전체 (총여선교회장)"],
  ["SOK_M_ALL", "남선교회 전체 (총남선교회장)"],
  ...sokKeys()
      .map(k=>[k, sokKeyLabel(k)]),
  ["S_ALL", "교회학교 전체 (유치부~청년부)"],
  ...SCHOOL_DEPTS.map(s=>["S_"+s.key, "교회학교 · "+s.label]),
];
const LEGACY_SCOPE = {MIN:"교역자 명단", SAMO:"사모 명단"};
const scopeLabel = k => {
  const f = SCOPE_LIST().find(x=>x[0]===k);
  return f ? f[1] : (LEGACY_SCOPE[k] || "편성 없음");
};
/* 한 사람의 담당 목록 (예전 방식인 문자열 하나도 그대로 읽힘) */
const scopesOf = (leaders, id) => {
  const v = (leaders||{})[id];
  if(!v) return [];
  return Array.isArray(v) ? v.filter(Boolean) : [v];
};
/* 담당 범위에 드는 사람인지 */
/* 속 하나가 여선교회인지 남선교회인지 (나이 방식은 키 앞 글자, 그 밖에는 이름으로) */
const sokSideOf = (key) => {
  if(!key) return "";
  if(key[0] === "여" || key[0] === "남") return key[0];
  const f = SOK_LIST.find(s => s.id === key);
  const nm = (f && f.name) || "";
  if(nm.indexOf("여") >= 0) return "여";
  if(nm.indexOf("남") >= 0) return "남";
  return "";
};

const inScope = (m, k) => {
  const sk = scopeKeyOf(m);
  if(k === ATT_ONLY)  return sk.indexOf("S_") !== 0;                  /* 교역자·어른 전부, 교회학교 제외 */
  if(k === "SOK_ALL") return sk === "MIN" || sk === "SAMO" || (sk !== "zz" && sk.indexOf("S_") !== 0);
  if(k === "SOK_F_ALL") return sokSideOf(sk) === "여";                /* 여선교회 전부 */
  if(k === "SOK_M_ALL") return sokSideOf(sk) === "남";                /* 남선교회 전부 */
  if(k === "S_ALL")   return sk.indexOf("S_") === 0;                  /* 교회학교 전부 */
  return sk === k;
};

const schoolDeptOf = m => {
  if(isMinister(m) || isSamo(m)) return null;
  if(isYoungAdult(m)) return SCHOOL_DEPTS.find(s => s.key === "young") || null;
  const a = koAge(m.birth);
  if(a === null) return null;
  return SCHOOL_DEPTS.find(s => a >= s.min && a <= s.max) || null;
};

/* ───────── 로그인 / 회원가입 ───────── */
function Auth({sb, resetServer, embedded}){
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setBusy(true); setMsg("");
    try{
      if(mode === "login"){
        const {error} = await sb.auth.signInWithPassword({email, password:pw});
        if(error) setMsg("로그인 실패 — " + errMsg(error));
      }else{
        const {data, error} = await sb.auth.signUp({email, password:pw, options:{data:{name}}});
        if(error) setMsg("가입 실패 — " + errMsg(error));
        else if(!data.session) setMsg("가입 신청이 접수되었습니다. 이메일 확인이 켜져 있는 서버라면 받은 메일의 확인 버튼을 누른 뒤 로그인해 주세요.");
      }
    }catch(e){ setMsg(errMsg(e)); }
    setBusy(false);
  };

  return (
    <div className="center-box">
      <div className="panel">
        <div className="logo-line"><Logo/> 교인 관리</div>
        <div className="auth-tabs">
          <button className={mode==="login"?"on":""} onClick={()=>{setMode("login");setMsg("");}}>로그인</button>
          <button className={mode==="signup"?"on":""} onClick={()=>{setMode("signup");setMsg("");}}>가입 신청</button>
        </div>
        {mode==="signup" &&
          <div className="field"><label>이름</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="실명을 입력해 주세요"/></div>}
        <div className="field"><label>이메일</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com"/></div>
        <div className="field"><label>비밀번호</label>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="6자 이상"
            onKeyDown={e=>{ if(e.key==="Enter") submit(); }}/></div>
        {msg && <div className="err-banner">{msg}</div>}
        <button className="btn" style={{width:"100%"}} disabled={busy || !email || pw.length<6 || (mode==="signup" && !name.trim())}
          onClick={submit}>{busy ? "처리 중…" : (mode==="login" ? "로그인" : "가입 신청")}</button>
        {mode==="signup" &&
          <p className="small muted" style={{marginBottom:0}}>가입 후에는 <b>관리자(담임목사)의 승인</b>이 있어야 교인 기록을 볼 수 있습니다.</p>}
        {!embedded && <React.Fragment>
          <hr className="divider"/>
          <button className="btn sm ghost" onClick={resetServer}>서버 주소 다시 설정</button>
        </React.Fragment>}
      </div>
    </div>
  );
}

/* ───────── 최상위 ───────── */
function Root(){
  const embedded = !!(EMBED_URL && EMBED_KEY);
  const [cfg, setCfg] = useState(()=>{
    if(EMBED_URL && EMBED_KEY) return {url:EMBED_URL, key:EMBED_KEY};
    try{ const c = JSON.parse(localStorage.getItem(CFG_KEY)); if(c && c.url && c.key) return c; }catch(e){}
    return null;
  });
  const sb = useMemo(()=> cfg ? supabase.createClient(cfg.url, cfg.key) : null, [cfg]);
  const [session, setSession] = useState(undefined); // undefined=확인 중
  const [profile, setProfile] = useState(undefined);

  useEffect(()=>{
    if(!sb){ setSession(null); return; }
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub} = sb.auth.onAuthStateChange((_e, s)=>setSession(s||null));
    return ()=>sub.subscription.unsubscribe();
  }, [sb]);

  const loadProfile = useCallback(async ()=>{
    if(!sb || !session){ setProfile(undefined); return; }
    const {data} = await sb.from("church_profiles").select("*").eq("id", session.user.id).maybeSingle();
    if(data){ setProfile(data); return; }
    /* 이 프로그램에 처음 들어온 사람 → 승인 대기로 등록 (회계 프로그램 가입자와 섞이지 않음) */
    const nm = (session.user.user_metadata && session.user.user_metadata.name) || "";
    await sb.from("church_profiles").insert({id:session.user.id, email:session.user.email, name:nm, role:"pending"});
    const again = await sb.from("church_profiles").select("*").eq("id", session.user.id).maybeSingle();
    setProfile(again.data || {id:session.user.id, email:session.user.email, name:nm, role:"pending", missing:true});
  }, [sb, session]);

  useEffect(()=>{ if(session) loadProfile(); }, [session, loadProfile]);

  const [lastCfg, setLastCfg] = useState(null);
  const saveCfg = c => { localStorage.setItem(CFG_KEY, JSON.stringify(c)); setCfg(c); };
  const resetServer = () => { setLastCfg(cfg); localStorage.removeItem(CFG_KEY); setCfg(null); };
  const logout = async () => { await sb.auth.signOut(); setProfile(undefined); };

  if(!cfg) return <Setup onSave={saveCfg} initial={lastCfg}/>;
  if(session === undefined) return <div className="center-box"><div className="panel empty">서버에 연결하는 중…</div></div>;
  if(!session) return <Auth sb={sb} resetServer={resetServer} embedded={embedded}/>;
  if(profile === undefined) return <div className="center-box"><div className="panel empty">사용자 정보를 확인하는 중…</div></div>;
  if(profile.role === "pending") return <Pending profile={profile} logout={logout} refresh={loadProfile}/>;
  return <App sb={sb} profile={profile} logout={logout}/>;
}

  const fileRef = useRef(null);

  /* 교회학교 반: {부서키: {classes:[{id,name}], of:{교인ID:반ID}}} */
  const [schoolClasses, setSchoolClasses] = useState({});

  const [specials, setSpecials] = useState([]);  /* 특별예배 [{key,label,from,to}] */

  const rangeScopes = myScopes.filter(k => ROLE_SCOPES.indexOf(k) < 0);
  const isLeader = !isAdmin && !isPastor && !isElder && rangeScopes.length > 0;  /* 속장 · 교회학교 교사 */

  const listScopes = rangeScopes.filter(k => k !== ATT_ONLY);

  /* 고칠 수 있는 사람 — 장로는 아무리 권한이 있어도 열람만 */
  const canEdit = !isElder && editRole && (isAdmin || isPastor || !isLeader);
  /* 출석 체크는 권한이 '수정 허용' 이상일 때만 — 열람 허용은 보기만 합니다 */
  const canCheckAtt = canEdit || (isLeader && editRole);
  /* 교회학교 담당 교사인지 (부서 하나 이상 맡은 경우) */
  const isSchoolTeacher = isLeader && listScopes.some(k => k === "S_ALL" || k.indexOf("S_") === 0);
  /* 출석 체크만 맡은 분 — 다른 담당이 함께 있으면 명부도 볼 수 있음 */
  const attOnly = isLeader && listScopes.length === 0;   /* 명단 권한 없이 출석만 맡은 분 */
  /* 사람 범위로 쓰는 담당만 (심방 열람 표시는 뺀다) */
  /* 심방·긴밀 기도를 전부 볼 수 있는 사람 — 관리자와, 관리자가 따로 켜 준 사람 */
  const canSeeAllCare = isAdmin || myScopes.indexOf(CARE_ALL) >= 0;
  /* 성도·교회학교 전체를 보는 사람 */
  const fullView = isAdmin || isPastor || isElder;
  /* 담당이 하나도 없는 사람 — 달력과 일반 중보기도만 봅니다 */
  const noScope = !fullView && rangeScopes.length === 0;
  /* 이 사람의 정보를 고칠 수 있는가 — 교사는 자기 담당 학생만 */
  const canEditMember = (m) => {
    if(canEdit) return true;
    if(!m || !isSchoolTeacher) return false;
    if(!schoolDeptOf(m)) return false;                          /* 어른은 못 고침 */
    return listScopes.some(k => inScope(m, k));                 /* 담당 부서 학생만 */
  };
  /* 속장은 자기 속(또는 담당 부서) 사람만 보임 */
  const myMembers = isLeader
    ? members.filter(m => listScopes.some(k => inScope(m, k)))
    : members;   /* 관리자·교역자·장로는 전체 */
  /* 출석 체크에서 볼 수 있는 범위 — 담당 전부 (출석 체크만 포함) */
  const attMembers = isLeader
    ? members.filter(m => rangeScopes.some(k => inScope(m, k)))
    : members;
  /* 이 사람이 출석을 체크해도 되는 교인인지 */
  const canCheckMember = (m) => {
    if(!editRole) return false;                                /* 열람 허용은 체크 못 함 */
    if(isAdmin || isPastor) return true;
    if(isElder) return elderScopes.some(k => inScope(m, k));   /* 겸직한 담당만 */
    return canCheckAtt;
  };
  /* 속장·교사가 담당 범위 밖이라도 볼 수 있는 사람: 담당 교인과 가족으로 이어진 분 (한 다리까지) */
  const viewMembers = useMemo(()=>{
    if(!isLeader) return members;
    const mine = myMembers;
    const mineIds = new Set(mine.map(x=>x.id));
    const nm = s => (s||"").trim();
    const famNames = new Set();
    mine.forEach(x => (x.family||[]).forEach(f => { if(nm(f.name)) famNames.add(nm(f.name)); }));
    const myNames = new Set(mine.map(x=>nm(x.name)).filter(Boolean));
    const extra = members.filter(x =>
      !mineIds.has(x.id) && (
        famNames.has(nm(x.name)) ||                                   /* 담당 교인의 가족란에 있는 분 */
        (x.family||[]).some(f => myNames.has(nm(f.name)))             /* 그분의 가족란에 담당 교인이 있는 경우 */
      ));
    return [...mine, ...extra];
  }, [isLeader, members, myMembers]);

  const fail = e => setErr("저장/불러오기에 실패했습니다 — 원인: " + errMsg(e) + " · 이 문구를 Claude에게 보여주시면 해결할 수 있습니다.");

  const loadAll = useCallback(async ()=>{
    setErr("");
    const [m, a, s] = await Promise.all([
      sb.from("church_members").select("id,data"),
      sb.from("church_attendance").select("date,service,member_ids"),
      sb.from("church_settings").select("key,value"),
    ]);
    if(m.error) return fail(m.error);
    if(a.error) return fail(a.error);
    setMembers((m.data||[]).map(r=>r.data));
    const na = {};
    (a.data||[]).forEach(r=>{ na[r.date] = na[r.date]||{}; na[r.date][r.service] = r.member_ids||[]; });
    setAtt(na);
    if(!s.error){
      const cn = (s.data||[]).find(r=>r.key==="churchName");
      if(cn && cn.value) setChurchName(cn.value);
      try{ setHomePhoto(parseChurchHomePhoto(s.data)); setHomePhotoReady(true); }
      catch(_){ setHomePhoto(null); setHomePhotoReady(false); }
      const cc = (s.data||[]).find(r=>r.key==="churchConfig");
      if(cc && cc.value){ try{ applyChurchConfig(JSON.parse(cc.value)); setCfgVer(v=>v+1); }catch(_){} }
      const sp = (s.data||[]).find(r=>r.key==="specialServices");
      if(sp && sp.value){ try{ setSpecials(JSON.parse(sp.value)||[]); }catch(_){ setSpecials([]); } }
      else setSpecials([]);
      const ev = (s.data||[]).find(r=>r.key==="events");
      if(ev && ev.value){ try{ setEvents(JSON.parse(ev.value)||[]); }catch(_){ setEvents([]); } }
      else setEvents([]);
      const sc = (s.data||[]).find(r=>r.key==="schoolClasses");
      if(sc && sc.value){ try{ setSchoolClasses(JSON.parse(sc.value)||{}); }catch(_){ setSchoolClasses({}); } }
      const ld = (s.data||[]).find(r=>r.key==="leaders");
      if(ld && ld.value){ try{ setLeaders(JSON.parse(ld.value)||{}); }catch(_){ setLeaders({}); } }
      else setLeaders({});
    }
    setLoaded(true);
  }, [sb]);

  useEffect(()=>{ loadAll(); }, [loadAll]);

  /* ── 서버 쓰기 ── */
  const saveMemberRow = async (m) => {
    setMembers(ms => ms.some(x=>x.id===m.id) ? ms.map(x=>x.id===m.id?m:x) : [...ms, m]);
    const {error} = await sb.from("church_members")
      .upsert({id:m.id, data:m, updated_at:new Date().toISOString(), updated_by:profile.id});
    if(error){ fail(error); loadAll(); }
  };
  const updateMember = (id, fn) => {
    const cur = members.find(x=>x.id===id); if(!cur) return;
    saveMemberRow(fn(cur));
  };
  const removeMember = async (id) => {
    setMembers(ms=>ms.filter(x=>x.id!==id));
    const {error} = await sb.from("church_members").delete().eq("id", id);
    if(error){ fail(error); loadAll(); return; }
    // 출석 기록에서도 제거
    const updates = [];
    const na = {};
    for(const d in att){
      na[d] = {};
      for(const s in att[d]){
        const ids = att[d][s];
        if(ids.includes(id)){
          const nids = ids.filter(x=>x!==id);
          na[d][s] = nids;
          updates.push({date:d, service:s, member_ids:nids, updated_at:new Date().toISOString()});
        }else na[d][s] = ids;
      }
    }
    setAtt(na);
    if(updates.length){
      const {error:e2} = await sb.from("church_attendance").upsert(updates);
      if(e2){ fail(e2); loadAll(); }
    }
  };
  const saveAtt = async (date, service, ids) => {
    setAtt(a=>({...a, [date]:{...(a[date]||{}), [service]:ids}}));
    const {error} = await sb.from("church_attendance")
      .upsert({date, service, member_ids:ids, updated_at:new Date().toISOString()});
    if(error){ fail(error); loadAll(); }
  };
  const renameChurch = async () => {
    const n = prompt("교회 이름을 입력하세요", churchName);
    if(!n || !n.trim()) return;
    setChurchName(n.trim());
    const {error} = await sb.from("church_settings").upsert({key:"churchName", value:n.trim()});
    if(error) fail(error);
  };

  /* ── 백업 ── */
  const doExport = () => {
    const blob = new Blob([JSON.stringify({version:1, exportedAt:new Date().toISOString(), churchName, members, att}, null, 2)],
      {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `교인관리_백업_${todayStr()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  };
  const [pendingImport, setPendingImport] = useState(null);
  const doImport = (file) => {
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!d || !Array.isArray(d.members)) throw new Error("형식 오류");
        setPendingImport(d);
      }catch(e){ alert("백업 파일을 읽지 못했습니다. 이 프로그램에서 내보낸 JSON 파일인지 확인해 주세요."); }
    };
    r.readAsText(file);
  };
  const runImport = async (mode) => {
    const d = pendingImport;
    setPendingImport(null);
    setErr("");
    let e;
    if(mode === "replace"){
      ({error:e} = await sb.from("church_members").delete().neq("id","")); if(e) return fail(e);
      ({error:e} = await sb.from("church_attendance").delete().neq("date","")); if(e) return fail(e);
    }
    const curById = {};
    if(mode === "merge") members.forEach(x=>{ curById[x.id] = x; });
    const rows = (d.members||[]).map(im=>{
      const data = (mode === "merge" && im.id && curById[im.id]) ? mergeMember(curById[im.id], im) : im;
      return {id:im.id||uid(), data, updated_at:new Date().toISOString(), updated_by:profile.id};
    });
    for(let i=0;i<rows.length;i+=100){
      ({error:e} = await sb.from("church_members").upsert(rows.slice(i,i+100))); if(e) return fail(e);
    }
    const attIn = d.att||{};
    const arows = [];
    for(const dt in attIn) for(const s in attIn[dt]){
      let ids = attIn[dt][s]||[];
      if(mode === "merge"){
        const cur = (att[dt] && att[dt][s]) || [];
        ids = Array.from(new Set([...cur, ...ids]));
      }
      if(ids.length) arows.push({date:dt, service:s, member_ids:ids, updated_at:new Date().toISOString()});
    }
    for(let i=0;i<arows.length;i+=100){
      ({error:e} = await sb.from("church_attendance").upsert(arows.slice(i,i+100))); if(e) return fail(e);
    }
    if(d.churchName && (mode === "replace" || !churchName || churchName === "우리교회")){
      await sb.from("church_settings").upsert({key:"churchName", value:d.churchName});
    }
    await loadAll();
    alert(mode === "merge" ? "명단을 합쳐 넣었습니다." : "가져오기(전체 교체)가 완료되었습니다.");
  };

  const saveSettings = async (nextConfig, nextPhoto) => {
    const photo = normalizeChurchHomePhoto(nextPhoto);
    const {error} = await sb.from("church_settings").upsert([
      {key:"churchConfig", value:JSON.stringify(nextConfig)},
      {key:CHURCH_HOME_PHOTO_KEY, value:JSON.stringify(photo)},
    ]);
    if(error) throw new Error(errMsg(error));
    applyChurchConfig(nextConfig); setCfgVer(v=>v+1);
    setHomePhoto(photo); setHomePhotoReady(true);
  };

  const saveConfig = async (next) => {
    applyChurchConfig(next); setCfgVer(v=>v+1);
    const {error} = await sb.from("church_settings").upsert({key:"churchConfig", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveSpecials = async (next) => {
    setSpecials(next);
    const {error} = await sb.from("church_settings").upsert({key:"specialServices", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveEvents = async (next) => {
    setEvents(next);
    const {error} = await sb.from("church_settings").upsert({key:"events", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveClasses = async (next) => {
    setSchoolClasses(next);
    const {error} = await sb.from("church_settings").upsert({key:"schoolClasses", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveLeaders = async (next) => {
    setLeaders(next);
    const {error} = await sb.from("church_settings").upsert({key:"leaders", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const byId = id => members.find(m => m.id === id);
  
  /* 뒤로 가기: 지나온 화면을 쌓아 두었다가 한 걸음씩 되돌아감 */
  const histRef = useRef([]);
  const [histLen, setHistLen] = useState(0);
  const nowScreen = useRef({view:"home", memView:{mode:"list"}});
  nowScreen.current = {view, memView};

  const pushHistory = (from) => {
    const cur = from || nowScreen.current;
    const last = histRef.current[histRef.current.length-1];
    /* 같은 화면이면 쌓지 않음 */
    if(last && last.view===cur.view &&
       (last.memView||{}).mode===(cur.memView||{}).mode &&
       (last.memView||{}).id===(cur.memView||{}).id) return;
    histRef.current = [...histRef.current.slice(-29), cur];
    setHistLen(histRef.current.length);
  };
  const goBack = () => {
    if(!histRef.current.length) return;
    const prev = histRef.current[histRef.current.length-1];
    histRef.current = histRef.current.slice(0, -1);
    setHistLen(histRef.current.length);
    setView(prev.view);
    setMemView(prev.memView || {mode:"list"});
    window.scrollTo(0,0);
  };

  const go = v => {
    const allowed = navItems.some(x => x[0] === v);
    if(!allowed) return;
    if(v !== view) pushHistory();
    setView(v); if(v==="members") setMemView({mode:"list"}); window.scrollTo(0,0);
  };
  const openMember = id => {
    if(attOnly) return;
    if(isLeader && !viewMembers.some(m=>m.id===id)) return;
    pushHistory();
    setView("members"); setMemView({mode:"detail", id}); window.scrollTo(0,0);
  };

  let navItems;
  if(noScope){
    /* 담당이 없는 분 — 달력과 일반 중보기도만 (보기만) */
    navItems = [["home","홈"],["cal","달력"],["pray","중보기도"]];
  } else if(attOnly){
    navItems = [["home","홈"],["att","예배 출석 체크"]];
  } else if(isElder){
    /* 장로 — 전체를 보되 고치지는 못함 */
    navItems = [["home","홈"],["members","교인"],["att","출석"],["cal","달력"],["pray","중보기도"]];
  } else if(isLeader){
    navItems = [["home","홈"],
      ["members", listScopes.every(k=>k.indexOf("S_")===0) ? "우리 부서"
                : listScopes.some(k=>k.indexOf("S_")===0) ? "담당 교인" : "우리 속 교인"],
      ["att","출석 체크"],["cal","달력"],["pray","중보기도"]];
  } else {
    navItems = [["home","홈"],["members","교인"],["att","출석"],["cal","달력"],["pray","중보기도"]];
  }
  /* 심방 메뉴는 전체 열람이 켜진 사람에게만 */
  if(canSeeAllCare && !noScope){
    const at = navItems.findIndex(x=>x[0]==="pray");
    navItems.splice(at >= 0 ? at : navItems.length, 0, ["visit","심방"]);
  }
  if(isAdmin){ navItems.push(["team","사용자"]); navItems.push(["cfg","설정"]); }

  if(!entered) return <Gate churchName={churchName} onEnter={()=>setEntered(true)}/>;

  return (
    <div>
      {pendingImport && (
        <div className="modal-back" onClick={()=>setPendingImport(null)}>
          <div className="panel" onClick={e=>e.stopPropagation()}>
            <h2>명단 가져오기</h2>
            <p className="small">파일에 교인 <b>{pendingImport.members.length}명</b>의 기록이 있습니다. 어떻게 넣을까요?</p>
            <button className="btn" style={{width:"100%",marginBottom:8}} onClick={()=>runImport("merge")}>
              추가하기 — 기존 기록은 그대로 두고 합침 (권장)</button>
            <button className="btn danger" style={{width:"100%",marginBottom:8}} onClick={()=>runImport("replace")}>
              전체 교체 — 기존 교인·출석 기록을 지우고 이 파일로 바꿈</button>
            <button className="btn ghost" style={{width:"100%"}} onClick={()=>setPendingImport(null)}>취소</button>
            <p className="muted small" style={{marginTop:10,marginBottom:0}}>
              추가하기를 누르면 새 교인은 추가되고, 같은 교인(같은 고유번호)은 파일 내용으로 갱신됩니다. 모든 사용자에게 함께 적용됩니다.</p>
          </div>
        </div>
      )}
      <header className="top">
        <div className="top-in">
          <div className="brand">
            <button className="logo-btn" onClick={()=>{ setEntered(false); window.scrollTo(0,0); }}
              title="시작 화면으로">
              <Logo/>
            </button>
            <button onClick={isAdmin ? renameChurch : undefined} title={isAdmin?"교회 이름 바꾸기":""}>{churchName} 교인 관리</button>
          </div>
          <button className={"back-btn"+(histLen>0?"":" off")} onClick={goBack}
            title="이전 화면으로" aria-hidden={histLen===0} tabIndex={histLen>0?0:-1}>‹ 뒤로</button>
          <nav>
            {navItems.map(([k,l])=>(
              <button key={k} className={view===k?"on":""} onClick={()=>go(k)}>{l}</button>
            ))}
          </nav>
          <div className="top-right">
            {canEdit && !isLeader && <button className="backup-btn" onClick={doExport}>백업</button>}
            {isAdmin && <button className="backup-btn" onClick={()=>fileRef.current.click()}>가져오기</button>}
            <button className="backup-btn" onClick={logout}>
              <span className="me-name">{profile.name || "나"} · </span>로그아웃</button>
            <input ref={fileRef} type="file" accept=".json,application/json" style={{display:"none"}}
              onChange={e=>{ if(e.target.files[0]) doImport(e.target.files[0]); e.target.value=""; }}/>
          </div>
        </div>
      </header>

      {/* 휴대폰에서는 메뉴를 아래쪽 탭바로 */}
      <nav className="tabbar" aria-label="화면 이동">
        <button className={"tab"+(histLen>0?"":" off")} onClick={goBack}
          aria-hidden={histLen===0} tabIndex={histLen>0?0:-1}>
          <span className="tab-ico">‹</span><span className="tab-lab">뒤로</span></button>
        {navItems.map(([k,l])=>(
          <button key={k} className={"tab"+(view===k?" on":"")} onClick={()=>go(k)}>
            <span className="tab-ico">{TAB_ICON[k] || "•"}</span>
            <span className="tab-lab">{TAB_SHORT[l] || l}</span>
          </button>))}
      </nav>

      <div className="wrap">
        {err && <div className="err-banner">{err} <button className="btn sm ghost" onClick={loadAll}>다시 불러오기</button></div>}
        {!loaded ? <div className="panel empty">기록을 불러오는 중…</div> : <React.Fragment>
        {isLeader && <div className="panel" style={{padding:"12px 16px",marginBottom:12}}>
          <b>{myScopes.map(scopeLabel).join(" · ")}</b> 담당으로 접속 중입니다.
          <span className="muted small">
            {attOnly
              ? ` · 성도 ${attMembers.length}명의 예배 출석만 체크하실 수 있습니다. 교인 신상은 보이지 않습니다.`
              : myScopes.includes(ATT_ONLY)
              ? ` · 예배 출석은 ${attMembers.length}명 전체를 체크하시고, 교인 명단은 담당 ${myMembers.length}명만 보입니다.`
              : ` · ${myMembers.length}명의 신상을 보고 출석을 체크하실 수 있습니다.`}
            {isSchoolTeacher && " 담당 부서 학생의 정보는 직접 수정하실 수 있습니다."}</span>
        </div>}
        {view==="home" && <Home churchName={churchName} members={attOnly ? [] : myMembers} att={att} go={go} openMember={openMember} homePhoto={homePhoto}/>}
        {view==="members" && attOnly &&
          <p className="empty">예배 출석 체크만 맡으셨습니다. 교인 명부는 볼 수 없습니다.</p>}
        {view==="members" && !attOnly && (
          memView.mode==="list" ? <MemberList members={myMembers}
            setMemView={v=>{ pushHistory({view:"members", memView:{mode:"list"}}); setMemView(v); }} canEdit={canEdit}
            schoolClasses={schoolClasses} saveClasses={saveClasses}
            canEditClass={(deptKey)=> canEdit ||
              (isSchoolTeacher && listScopes.some(k => k==="S_ALL" || k==="S_"+deptKey))}/> :
          memView.mode==="form" && memView.id && !canEditMember(byId(memView.id))
            ? <div className="panel empty">이 교인의 정보는 수정할 수 없습니다.
                <div style={{marginTop:10}}><button className="btn sm" onClick={()=>setMemView({mode:"detail", id:memView.id})}>돌아가기</button></div>
              </div> :
          memView.mode==="form" && !memView.id && !canEdit
            ? <div className="panel empty">새 교인 등록은 관리자와 수정 권한이 있는 분만 할 수 있습니다.
                <div style={{marginTop:10}}><button className="btn sm" onClick={()=>setMemView({mode:"list"})}>돌아가기</button></div>
              </div> :
          memView.mode==="form" ? <MemberForm init={memView.id ? byId(memView.id) : null}
              onCancel={()=>setMemView(memView.id ? {mode:"detail", id:memView.id} : {mode:"list"})}
              onSave={(m)=>{ saveMemberRow(m); setMemView({mode:"detail", id:m.id}); }}/> :
          <MemberDetail m={viewMembers.find(x=>x.id===memView.id)} att={att} specials={specials}
            setMemView={v=>{ pushHistory({view:"members", memView}); setMemView(v); }}
            canEdit={canEdit || canEditMember(viewMembers.find(x=>x.id===memView.id))}
            canDelete={canEdit}
            allMembers={viewMembers} openMember={openMember} limited={!canSeeAllCare}
            canPray={!attOnly && !isElder && (canEdit || myMembers.some(x=>x.id===memView.id))}
            meName={profile.name || profile.email} meId={profile.id}
            outside={isLeader && !myMembers.some(x=>x.id===memView.id)}
            update={fn=>updateMember(memView.id, fn)}
            remove={()=>{
              const m = byId(memView.id);
              if(confirm(`'${m.name}' 님의 모든 기록(가족·심방·기도 포함)을 삭제할까요?\n모든 사용자에게 함께 적용되며, 되돌릴 수 없습니다.`)){
                removeMember(memView.id);
                setMemView({mode:"list"});
              }
            }}/>
        )}
        {view==="att" && <Attendance members={attMembers} att={att} saveAtt={saveAtt}
          canEdit={canCheckAtt || (isElder && editRole && elderScopes.length > 0)}
          canCheckMember={canCheckMember}
          schoolClasses={schoolClasses} specials={specials} saveSpecials={saveSpecials} isAdmin={isAdmin || canEdit}/>}
        {view==="visit" && (!canSeeAllCare
          ? <p className="empty">심방 기록은 목회자와 관리자만 볼 수 있습니다.</p>
          : <Visits members={members} update={updateMember} openMember={openMember} canEdit={canEdit}
              meName={profile.name || profile.email} meId={profile.id}/>)}
        {view==="cal" && <Calendar members={members} events={events} saveEvents={saveEvents}
          canEdit={isAdmin || isPastor} openMember={openMember}
          openable={!noScope && !attOnly}/>}
        {view==="pray" &&
          <Prayers members={members} update={updateMember} openMember={openMember}
            canEdit={canEdit && !noScope} seeSecret={canSeeAllCare}
            openable={!noScope && !attOnly}
            meName={profile.name || profile.email} meId={profile.id}/>}
        {view==="team" && isAdmin && <Team sb={sb} me={profile} leaders={leaders} saveLeaders={saveLeaders}/>}
        {view==="cfg" && isAdmin && <ChurchConfig key={cfgVer} saveConfig={saveConfig}
          homePhoto={homePhoto} homePhotoReady={homePhotoReady} saveSettings={saveSettings}
          churchName={churchName}/>}
        </React.Fragment>}

/* ───────── 사용자(승인) 관리 ───────── */
/* 권한 + 담당을 합쳐서 '실제로 할 수 있는 일'을 한 줄로 풀어 줍니다 */
function abilityOf(role, scopes){
  if(role === "admin") return {can:"모든 기능", cant:""};
  if(role === "pending") return {can:"", cant:"승인을 기다리는 중입니다"};
  const sc = scopes || [];
  const isPastor = sc.indexOf(PASTOR) >= 0;
  const isElder  = sc.indexOf(ELDER)  >= 0;
  const seeCare  = sc.indexOf(CARE_ALL) >= 0;
  const range    = sc.filter(k => [PASTOR, ELDER, CARE_ALL].indexOf(k) < 0);
  const attOnly  = range.length === 1 && range[0] === ATT_ONLY;
  const editRole = role === "editor";
  const can = [], cant = [];

  /* 무엇을 보나 */
  if(isPastor || isElder) can.push("성도·교회학교 전체 보기");
  else if(attOnly) can.push("출석 명단만 보기");
  else if(range.length) can.push(range.map(scopeLabel).join(", ") + " 보기");
  else { can.push("달력·일반 중보기도 보기"); cant.push("교인 명부 못 봄"); }

  /* 무엇을 고치나 */
  const canEditMembers = editRole && !isElder && (isPastor || range.length === 0);
  if(canEditMembers) can.push("교인 신상 수정");
  else if(range.length || isPastor || isElder) cant.push("교인 신상 수정 안 됨");

  /* 출석 체크 */
  if(editRole){
    if(isPastor) can.push("출석 체크(전체)");
    else if(isElder && range.length) can.push("출석 체크(" + range.map(scopeLabel).join(", ") + ")");
    else if(isElder) cant.push("출석 체크 안 됨");
    else if(attOnly) can.push("출석 체크(성도 전체)");
    else if(range.length) can.push("출석 체크(" + range.map(scopeLabel).join(", ") + ")");
  } else if(range.length || isPastor || isElder){
    cant.push("출석 체크 안 됨 (열람 허용이라서)");
  }

  /* 심방 */
  if(seeCare) can.push("심방·긴밀 기도 전체 보기");
  else if(!attOnly && range.length) cant.push("남이 쓴 심방 기록 못 봄");

  return {can: can.join(" · "), cant: cant.join(" · ")};
}

function Team({sb, me, leaders, saveLeaders}){
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState("");

  const load = useCallback(async ()=>{
    const {data, error} = await sb.from("church_profiles").select("*").order("created_at");
    if(error) setErr(errMsg(error)); else { setRows(data||[]); setErr(""); }
  }, [sb]);
  useEffect(()=>{ load(); }, [load]);

  const setRole = async (id, role) => {
    const {error} = await sb.from("church_profiles").update({role}).eq("id", id);
    if(error) setErr(errMsg(error)); else load();
  };
  const removeUser = async (r) => {
    if(!confirm(`${r.name || r.email} 님을 목록에서 지울까요?\n\n이 프로그램의 권한만 사라집니다. 그 사람이 다시 들어오면 승인 대기로 다시 올라옵니다.`)) return;
    const {error} = await sb.from("church_profiles").delete().eq("id", r.id);
    if(error) setErr(errMsg(error)); else load();
  };

  const pending = (rows||[]).filter(r=>r.role==="pending");
  const active = (rows||[]).filter(r=>r.role!=="pending");

  return (
    <div>
      <div className="panel">
        <h2>승인 대기 <span className="muted small">{pending.length}명</span></h2>
        <p className="small muted">여기 보이는 사람은 <b>이 교인관리 프로그램에 직접 들어와 본 사람</b>뿐입니다(회계 프로그램 가입자는 섞이지 않습니다).
          모르는 사람이 신청했다면 <b>거절</b>을 눌러 목록에서 지우세요.
          가입 신청한 사람 중 <b>믿을 수 있는 분만 승인</b>해 주세요. <b>열람 허용</b>은 보기만, <b>수정 허용</b>은 등록·수정까지 가능합니다.
          속장님은 출석을 저장해야 하므로 <b>수정 허용</b>으로 승인한 뒤, 아래 표에서 <b>담당 속</b>을 정해 주세요.
          담당이 정해지면 교인 신상은 보기만 되고 고칠 수는 없게 됩니다.
          <b>속 전체</b>는 어른 속 전부, <b>교회학교 전체</b>는 유치부~청년부 전부를 볼 수 있어 속회장·교회학교 부장께 알맞습니다.
          한 사람에게 <b>여러 담당</b>을 줄 수도 있습니다(예: 중고등부 + 여자 7속). 그러면 두 곳 사람이 모두 보입니다.
          교회학교 부서를 맡은 분은 <b>담당 부서 학생의 정보만</b> 수정할 수 있습니다(어른 교인과 새 교인 등록·삭제는 안 됩니다).
          <b>예배 출석 체크만</b>을 주면 성도 전체(교회학교 제외)의 출석만 체크하고 <b>교인 신상은 전혀 볼 수 없습니다</b> — 예배 안내위원께 알맞습니다.</p>
        {err && <div className="err-banner">{err}</div>}
        {rows===null ? <p className="empty">불러오는 중…</p> :
         pending.length===0 ? <p className="empty">승인을 기다리는 사람이 없습니다.</p> :
          <div className="tbl-wrap"><table>
            <thead><tr><th>이름</th><th>이메일</th><th>신청일</th><th></th></tr></thead>
            <tbody>{pending.map(r=>(
              <tr key={r.id}>
                <td>{r.name || <span className="muted">이름 없음</span>}</td>
                <td>{r.email}</td>
                <td>{(r.created_at||"").slice(0,10)}</td>
                <td style={{whiteSpace:"nowrap"}}>
                  <button className="btn sm ghost" onClick={()=>setRole(r.id,"viewer")}>열람 허용</button>{" "}
                  <button className="btn sm gold" onClick={()=>setRole(r.id,"editor")}>수정 허용</button>{" "}
                  <button className="btn sm danger" onClick={()=>removeUser(r)}>거절</button>
                </td>
              </tr>))}
            </tbody></table></div>}
      </div>

      <div className="panel">
        <h2>사용 중인 구성원 <span className="muted small">{active.length}명</span></h2>
        <p className="small muted"><b>권한</b>이 무엇을 고칠 수 있는지, <b>담당</b>이 어디까지 볼 수 있는지를 정합니다.
          <b>열람 허용</b>이면 담당이 있어도 출석 체크는 안 됩니다. 출석을 맡기시려면 <b>수정 허용</b>으로 주세요.<br/>
          담당을 <b>안 정하면</b> 달력과 일반 중보기도만 보게 됩니다(고치기는 안 됨).<br/>
          · <b>교역자</b> — 성도와 교회학교 전체를 보고 고칠 수 있습니다<br/>
          · <b>장로</b> — 성도와 교회학교 전체를 <b>보기만</b> 합니다(고치기 안 됨).
            출석 현황도 볼 수 있고, <b>속 담당을 함께 주면 그 속만 체크</b>할 수 있습니다<br/>
          · <b>심방·긴밀 기도 전체 보기</b> — 이것을 함께 켜 준 사람만 심방 메뉴와 긴밀 기도를 봅니다.
            켜지 않아도 자기가 심방한 기록은 남기고 볼 수 있습니다<br/>
          · <b>여선교회 전체 / 남선교회 전체</b> — 총여선교회장·총남선교회장께 드립니다<br/>
          · <b>속 하나 / 속 전체 / 교회학교 부서</b> — 그 범위 교인만 보고 출석을 체크합니다<br/>
          · <b>예배 출석 체크만</b> — 출석만 체크하고 교인 신상은 전혀 못 봅니다<br/>
          한 사람에게 <b>여러 담당</b>을 줄 수 있습니다(예: 교역자 + 심방 전체 보기).</p>
        {rows!==null &&
          <div className="tbl-wrap"><table>
            <thead><tr><th>이름</th><th>이메일</th><th>권한</th><th>담당 속(속장)</th><th></th></tr></thead>
            <tbody>{active.map(r=>(
              <tr key={r.id}>
                <td className="nw">{r.name || <span className="muted">이름 없음</span>}{r.id===me.id && " (나)"}</td>
                <td className="nw">{r.email}</td>
                <td className="nw"><span className={"chip "+r.role}>{ROLE_LABEL[r.role]||r.role}</span>
                  {scopesOf(leaders, r.id).length>0 && r.role!=="admin" && <span className="chip editor" style={{marginLeft:4}}>담당 있음</span>}
                  {(()=>{ const ab = abilityOf(r.role, scopesOf(leaders, r.id));
                    return <div className="able">
                      {ab.can && <span className="able-yes">{ab.can}</span>}
                      {ab.cant && <span className="able-no">{ab.cant}</span>}
                    </div>; })()}</td>
                <td className="scope-col">
                  {r.role==="admin" ? <span className="muted small">관리자는 전체를 봅니다</span> :
                    <React.Fragment>
                      {scopesOf(leaders, r.id).map(k=>(
                        <span key={k} className="scope-row">
                          <span className="chip editor">{scopeLabel(k)}</span>
                          <button className="btn sm ghost" style={{padding:"0 7px"}}
                            title="이 담당 빼기"
                            onClick={()=>{
                              const next = {...(leaders||{})};
                              const left = scopesOf(leaders, r.id).filter(x=>x!==k);
                              if(left.length) next[r.id] = left; else delete next[r.id];
                              saveLeaders(next);
                            }}>✕</button>
                        </span>))}
                      <select value="" onChange={e=>{
                        if(!e.target.value) return;
                        const cur = scopesOf(leaders, r.id);
                        if(cur.includes(e.target.value)) return;
                        saveLeaders({...(leaders||{}), [r.id]: [...cur, e.target.value]});
                      }}>
                        <option value="">＋ 담당 추가…</option>
                        {SCOPE_LIST().filter(([k])=>!scopesOf(leaders, r.id).includes(k))
                          .map(([k,l])=><option key={k} value={k}>{l}</option>)}
                      </select>
                      {scopesOf(leaders, r.id).length===0 &&
                        <div className="muted small">담당 없음 — 전체를 봅니다</div>}
                    </React.Fragment>}
                </td>
                <td style={{whiteSpace:"nowrap"}}>
                  {r.id!==me.id && <React.Fragment>
                    {r.role!=="viewer" &&
                      <button className="btn sm ghost" onClick={()=>setRole(r.id,"viewer")}>열람만</button>}{" "}
                    {r.role!=="editor" &&
                      <button className="btn sm ghost" onClick={()=>setRole(r.id,"editor")}>수정 가능</button>}{" "}
                    {r.role!=="admin" &&
                      <button className="btn sm ghost" onClick={()=>{
                        if(confirm(`${r.name||r.email} 님을 관리자로 지정할까요? 관리자는 사용자 승인 권한도 갖게 됩니다.`)) setRole(r.id,"admin");
                      }}>관리자로</button>}{" "}
                    <button className="btn sm danger" onClick={()=>{
                      if(confirm(`${r.name||r.email} 님의 접근 권한을 해제할까요? 다시 승인하기 전까지 교인 기록을 볼 수 없게 됩니다.`)) setRole(r.id,"pending");
                    }}>권한 해제</button>{" "}
                    <button className="btn sm danger" onClick={()=>removeUser(r)}>목록에서 지우기</button>
                  </React.Fragment>}
                  {r.id===me.id && <span className="muted small">본인 권한은 바꿀 수 없습니다</span>}
                </td>
              </tr>))}
            </tbody></table></div>}
      </div>
    </div>
  );
}

function normalizeChurchHomePhoto(value){
  if(value === null || value === undefined) return null;
  if(typeof value !== "object" || value.version !== 1 ||
     typeof value.dataUrl !== "string" || value.dataUrl.length > CHURCH_HOME_PHOTO_LIMIT ||
     !/^data:image\/(jpeg|png);base64,[A-Za-z0-9+/]+={0,2}$/.test(value.dataUrl)){
    throw new Error("저장된 교회 사진 형식을 확인할 수 없습니다.");
  }
  const position = n => Number.isFinite(n) ? Math.min(100, Math.max(0, n)) : 50;
  return {version:1, dataUrl:value.dataUrl, fit:value.fit === "cover" ? "cover" : "contain",
          x:position(value.x), y:position(value.y), cut: value.cut === true};
}

function parseChurchHomePhoto(rows){
  const row = (rows || []).find(r => r.key === CHURCH_HOME_PHOTO_KEY);
  return row ? normalizeChurchHomePhoto(JSON.parse(row.value)) : null;
}

/* 가장자리에서 번져 들어가며 흰 배경만 지웁니다 (그림 안쪽 흰색은 남김) */
function eraseWhiteBackground(ctx, w, h){
  const im = ctx.getImageData(0, 0, w, h);
  const d = im.data;
  const near = i => d[i] > 228 && d[i+1] > 228 && d[i+2] > 228;
  const seen = new Uint8Array(w * h);
  const stack = [];
  for(let x = 0; x < w; x++){ stack.push(x); stack.push((h-1)*w + x); }
  for(let y = 0; y < h; y++){ stack.push(y*w); stack.push(y*w + w - 1); }
  while(stack.length){
    const p = stack.pop();
    if(p < 0 || p >= w*h || seen[p]) continue;
    const i = p * 4;
    if(!near(i)) continue;
    seen[p] = 1; d[i+3] = 0;
    const x = p % w, y = (p - x) / w;
    if(x > 0) stack.push(p - 1);
    if(x < w-1) stack.push(p + 1);
    if(y > 0) stack.push(p - w);
    if(y < h-1) stack.push(p + w);
  }
  /* 가장자리 톱니를 부드럽게 */
  for(let p = 0; p < w*h; p++){
    if(seen[p]) continue;
    const i = p * 4;
    if(!near(i)) continue;
    const x = p % w, y = (p - x) / w;
    let open = 0;
    if(x > 0 && seen[p-1]) open++;
    if(x < w-1 && seen[p+1]) open++;
    if(y > 0 && seen[p-w]) open++;
    if(y < h-1 && seen[p+w]) open++;
    if(open) d[i+3] = Math.round(255 * (1 - open / 4));
  }
  ctx.putImageData(im, 0, 0);
}

function readChurchHomePhoto(file, cut){
  return new Promise((resolve, reject) => {
    if(!file || !["image/jpeg", "image/png", "image/webp"].includes(file.type)){
      reject(new Error("JPG, PNG, WebP 사진을 선택해 주세요. HEIC 사진은 JPG로 바꾼 뒤 올려 주세요.")); return;
    }
    if(file.size > 15 * 1024 * 1024){
      reject(new Error("사진은 15MB 이하로 선택해 주세요.")); return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("사진을 열 수 없습니다. 다른 사진으로 다시 시도해 주세요.")); };
    img.onload = () => {
      try{
        if(!img.naturalWidth || !img.naturalHeight) throw new Error("사진 크기를 확인할 수 없습니다.");
        const canvas = document.createElement("canvas");
        const scale = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
        const ctx = canvas.getContext("2d");
        if(!ctx) throw new Error("이 브라우저에서 사진을 처리할 수 없습니다.");
        let dataUrl = "";
        for(let attempt = 0; attempt < 7; attempt++){
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if(!cut){ ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          if(cut){
            eraseWhiteBackground(ctx, canvas.width, canvas.height);
            dataUrl = canvas.toDataURL("image/png");
          } else {
            dataUrl = canvas.toDataURL("image/jpeg", Math.max(.55, .85 - attempt * .08));
          }
          if(dataUrl.length <= CHURCH_HOME_PHOTO_LIMIT) break;
          canvas.width = Math.max(1, Math.round(canvas.width * (cut ? .75 : .8)));
          canvas.height = Math.max(1, Math.round(canvas.height * (cut ? .75 : .8)));
        }
        if(dataUrl.length > CHURCH_HOME_PHOTO_LIMIT)
          throw new Error("배경을 지운 사진이 너무 큽니다. 조금 작은 사진으로 올려 주세요.");
        resolve(normalizeChurchHomePhoto({version:1, dataUrl, fit:"contain", x:50, y:50, cut: !!cut}));
      }catch(e){ reject(e); }
      finally{ URL.revokeObjectURL(url); }
    };
    img.src = url;
  });
}

  const sunCount = lastSunday ? att[lastSunday].sun.length : 0;

  const openPray = members.reduce((n,m)=> n + (m.prayers||[]).filter(p=>p.status==="open").length, 0);
  const monthPrefix = `${new Date().getFullYear()}-${pad(thisMonth)}`;

        </button>
        <button className="stat clay" style={{textAlign:"left",cursor:"pointer"}} onClick={()=>go("pray")}>

/* ── 교회학교 한 부서: 반 나누기 · 반 이름 고치기 · 아이 옮기기 ── */
function SchoolDept({g, canEdit, setMemView, data, saveDept}){
  const preset = DEFAULT_CLASSES[g.key] || [];
  const classes = (data && data.classes) ? data.classes
                : preset.map((n,i)=>({id:"c"+g.key+i, name:n}));
  const of = (data && data.of) || {};
  const [editing, setEditing] = useState(false);
  const save = (classes2, of2) => saveDept({classes:classes2, of: of2 || of});

  const bucket = {};
  classes.forEach(c => bucket[c.id] = []);
  const rest = [];
  g.items.forEach(m => {
    const cid = of[m.id];
    if(cid && bucket[cid]) bucket[cid].push(m); else rest.push(m);
  });
  const Row = ({name, items, none}) => (
    <div style={{marginBottom:14}}>
      <div className={"cls-head"+(none?" none":"")}>
        <span className="nm">{name}</span>
        <span className="ct">{items.length}명</span>
      </div>
      {items.length===0
        ? <p className="muted small" style={{margin:"6px 0 0"}}>아직 배정된 학생이 없습니다.</p>
        : <div className="mem-list" style={{marginTop:8}}>
            {items.map(m=>(
              <div key={m.id}>
                <MemberCard m={m} onClick={()=>setMemView({mode:"detail", id:m.id})}/>
                {canEdit && classes.length>0 &&
                  <div className="row" style={{margin:"4px 0 10px"}}>
                    <span className="muted small">반</span>
                    <select value={of[m.id]||""} onChange={e=>{
                      const of2 = {...of};
                      if(e.target.value) of2[m.id]=e.target.value; else delete of2[m.id];
                      save(classes, of2);
                    }}>
                      <option value="">미배정</option>
                      {classes.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                  </div>}
              </div>))}
          </div>}
    </div>
  );

  return (
    <div style={{marginBottom:22}}>
      <DeptHead sKey={"S_"+g.key} name={g.label} count={g.items.length+"명"}
        right={canEdit && <button onClick={()=>setEditing(!editing)}>{editing ? "닫기" : "반 편집"}</button>}/>

      {editing && canEdit &&
        <div className="panel" style={{padding:"12px 16px", marginBottom:12}}>
          <p className="small muted" style={{marginTop:0}}>반 이름을 고치거나, 반을 더하고 뺄 수 있습니다.
            반을 지우면 그 반 학생들은 <b>미배정</b>으로 돌아갑니다.</p>
          {classes.map((c,i)=>(
            <div className="row" key={c.id} style={{marginBottom:6}}>
              <input value={c.name} onChange={e=>{
                const cs=[...classes]; cs[i]={...c, name:e.target.value}; save(cs);
              }} style={{flex:"1 1 160px"}}/>
              <button className="btn sm ghost" onClick={()=>{
                const of2={...of};
                Object.keys(of2).forEach(k=>{ if(of2[k]===c.id) delete of2[k]; });
                save(classes.filter(x=>x.id!==c.id), of2);
              }}>지우기</button>
            </div>))}
          <button className="btn sm" onClick={()=>save([...classes, {id:uid2(), name:"새 반"}])}>+ 반 추가</button>
        </div>}

      {g.items.length===0
        ? <p className="muted small" style={{margin:"0 0 8px"}}>해당 교인이 없습니다.</p>
        : classes.length===0
          ? <Row name="전체" items={g.items}/>
          : <React.Fragment>
              {classes.map(c=> <Row key={c.id} name={c.name} items={bucket[c.id]}/>)}
              {rest.length>0 && <Row name="미배정" items={rest} none/>}
            </React.Fragment>}
    </div>
  );
}

function MemberList({members, setMemView, canEdit, schoolClasses, saveClasses, canEditClass}){
  const [book, setBook] = useState("all"); // all=교인 명부 | sok=속별 명부
  const [q, setQ] = useState("");
  const [pos, setPos] = useState("전체");
  const [mode, setMode] = useState("pos"); // pos=직분별 | name=가나다순
  const positions = ["전체", ...Array.from(new Set(members.map(m=>m.position).filter(Boolean)))
    .sort((a,b)=>{
      const ia = POSITIONS.indexOf(a), ib = POSITIONS.indexOf(b);
      if(ia!==-1 && ib!==-1) return ia-ib;
      if(ia!==-1) return -1; if(ib!==-1) return 1;
      return a.localeCompare(b,"ko");
    })];
  const list = members
    .filter(m => book!=="all" || pos==="전체" || m.position===pos)
    .filter(m => !q || (m.name+m.phone+m.address).includes(q))
    .sort(koSort);

  const groups = useMemo(()=>{
    const map = {};
    list.forEach(m=>{ const p = m.position || "성도"; (map[p]=map[p]||[]).push(m); });
    const known = POSITIONS.filter(p=>map[p]);
    const extra = Object.keys(map).filter(p=>!POSITIONS.includes(p)).sort((a,b)=>a.localeCompare(b,"ko"));
    return [...known, ...extra].map(p=>({pos:p, items:map[p]}));
  }, [list]);

  const sokGroups = useMemo(()=>{
    const map = {};
    list.forEach(m=>{
      if(isMinister(m)){                                   /* 교역자는 따로 묶음 */
        if(!map["MIN"]) map["MIN"] = {s:null, items:[]};
        map["MIN"].items.push(m); return;
      }
      if(isSamo(m)){                                       /* 사모도 별도 항목 */
        if(!map["SAMO"]) map["SAMO"] = {s:null, items:[]};
        map["SAMO"].items.push(m); return;
      }
      const s = sokOf(m);
      /* 교회학교(유치부~청년부) 대상은 속별 명부에 나오지 않음 */
      if(!s && schoolDeptOf(m)) return;
      const key = s ? (s.id ? s.id : s.g + s.n) : "zz";
      if(!map[key]) map[key] = {s:s, items:[]};
      map[key].items.push(m);
    });
    const order = ["MIN","SAMO",...sokKeys(),"zz"];   /* 설정된 속 순서대로 */
    return order.filter(k=>map[k]).map(k=>({
      key:k,
      label: k==="MIN" ? "교역자" : k==="SAMO" ? "사모" : k==="zz" ? "속 미지정" : sokLabel(map[k].s),
      items: map[k].items
    }));
  }, [list]);

  const SCHOOL = SCHOOL_DEPTS;
  const schoolGroups = useMemo(()=>{
    return SCHOOL.map(s=>({
      key:s.key, label:s.label,
      items: list.filter(m=>{
        const d = schoolDeptOf(m);                          /* 청년 표시·교역자·사모까지 함께 판정 */
        return d && d.key === s.key;
      })
    }));
  }, [list]);

  const gTitle = {margin:"0 0 8px", fontSize:"17px", color:"var(--pine-deep)",
    borderBottom:"2px solid var(--gold)", display:"inline-block", paddingBottom:"2px"};

  return (
    <div>
      <div className="panel">
        <div className="row" style={{justifyContent:"space-between"}}>
          <h2 style={{margin:0}}>교인 <span className="muted small">{members.length}명</span></h2>
          {canEdit && <button className="btn gold" onClick={()=>setMemView({mode:"form"})}>+ 새 교인 등록</button>}
        </div>
        <div className="svc-tabs" style={{marginTop:14, marginBottom:0}}>
          <button className={book==="all"?"on":""} onClick={()=>setBook("all")}>교인 명부</button>
          <button className={book==="sok"?"on":""} onClick={()=>setBook("sok")}>속별 명부</button>
          <button className={book==="school"?"on":""} onClick={()=>setBook("school")}>교회학교</button>
        </div>
        <div className="row" style={{marginTop:12}}>
          <input placeholder="이름·연락처·주소 검색" value={q} onChange={e=>setQ(e.target.value)} style={{flex:"1 1 200px"}}/>
          {book==="all" && <select value={pos} onChange={e=>setPos(e.target.value)}>
            {positions.map(p=><option key={p}>{p}</option>)}
          </select>}
          {book==="all" && <div className="svc-tabs" style={{margin:0}}>
            <button className={mode==="pos"?"on":""} onClick={()=>setMode("pos")}>직분별</button>
            <button className={mode==="name"?"on":""} onClick={()=>setMode("name")}>가나다순</button>
          </div>}
        </div>
      </div>

      {list.length===0 ? <div className="panel empty">조건에 맞는 교인이 없습니다.</div> :
       book==="school" ?
        <div>
          {schoolGroups.every(g=>g.items.length===0) ?
            <div className="panel empty">교회학교(5~29세)에 해당하는 교인이 없습니다.<br/>
              자녀·학생도 '새 교인 등록'에서 생년월일과 함께 등록하면 나이에 따라 자동으로 분류됩니다.</div> :
            schoolGroups.map(g=>(
              <SchoolDept key={g.key} g={g} canEdit={canEditClass ? canEditClass(g.key) : canEdit} setMemView={setMemView}
                data={(schoolClasses||{})[g.key]} saveDept={(d)=>saveClasses({...(schoolClasses||{}), [g.key]: d})}/>
            ))}
        </div>
       : book==="sok" ?
        <div>
          {sokGroups.map(g=>(
            <div key={g.key} style={{marginBottom:18}}>
              <DeptHead sKey={g.key==="zz" ? "" : g.key} name={g.label} count={g.items.length+"명"}/>
              {g.key==="zz" && <p className="muted small" style={{margin:"0 0 8px"}}>
                성별·생년월일이 없어 속을 정하지 못했습니다. '정보 수정'에서 성별과 생년월일을 넣으면 자동 배정됩니다.</p>}
              <div className="mem-list">
                {g.items.map(m=>(
                  <MemberCard key={m.id} m={m} onClick={()=>setMemView({mode:"detail", id:m.id})}/>
                ))}
              </div>
            </div>
          ))}
        </div>
       : mode==="name" ?
        <div className="mem-list">
          {list.map(m=>(
            <MemberCard key={m.id} m={m} onClick={()=>setMemView({mode:"detail", id:m.id})}/>
          ))}
        </div>
       :
        <div>
          {groups.map(g=>(
            <div key={g.pos} style={{marginBottom:18}}>
              <h3 style={gTitle}>{g.pos} <span className="muted small">{g.items.length}명</span></h3>
              <div className="mem-list">
                {g.items.map(m=>(
                  <MemberCard key={m.id} m={m} onClick={()=>setMemView({mode:"detail", id:m.id})}/>
                ))}
              </div>
            </div>
          ))}
        </div>}
    </div>
  );
}

          <input placeholder="나이" type="number" min="0" value={f.age} onChange={e=>setArr("family",i,"age",e.target.value)} style={{width:75}}/>
          <input placeholder="직업 / 학교" value={f.job} onChange={e=>setArr("family",i,"job",e.target.value)} style={{flex:"1 1 140px"}}/>
          <button className="btn sm danger" onClick={()=>delRow("family",i)}>삭제</button>
        </div>
      ))}
      <button className="btn sm ghost" onClick={()=>addRow("family",{id:uid(),relation:"배우자",name:"",age:"",job:""})}>+ 가족 추가</button>

      <h3>봉사 부서 <span className="muted small">(과거 이력도 함께 기록)</span></h3>
      {m.depts.length===0 && <p className="muted small">등록된 봉사 부서가 없습니다.</p>}
      {m.depts.map((d,i)=>(
        <div className="row" key={d.id} style={{marginBottom:8}}>
          <input placeholder="부서명 (예: 찬양대)" value={d.name} onChange={e=>setArr("depts",i,"name",e.target.value)} style={{flex:"1 1 140px"}}/>
          <input placeholder="시작 (예: 2020)" value={d.from} onChange={e=>setArr("depts",i,"from",e.target.value)} style={{width:110}}/>
          <input placeholder="종료" value={d.to} disabled={d.current} onChange={e=>setArr("depts",i,"to",e.target.value)} style={{width:110}}/>
          <label className="row small" style={{gap:5}}>
            <input type="checkbox" checked={!!d.current}
              onChange={e=>{ setArr("depts",i,"current",e.target.checked); if(e.target.checked) setArr("depts",i,"to",""); }}/>
            현재 봉사 중
          </label>
          <button className="btn sm danger" onClick={()=>delRow("depts",i)}>삭제</button>
        </div>
      ))}
      <button className="btn sm ghost" onClick={()=>addRow("depts",{id:uid(),name:"",from:"",to:"",current:true})}>+ 부서 추가</button>

      <hr className="divider"/>
      <div className="row">
        <button className="btn" disabled={!m.name.trim()} onClick={()=>onSave({...m, name:m.name.trim()})}>저장</button>
        <button className="btn ghost" onClick={onCancel}>취소</button>
        {!m.name.trim() && <span className="muted small">이름을 입력하면 저장할 수 있습니다.</span>}
      </div>
    </div>
  );
}

/* ───────── 교인 상세 ───────── */
function MemberDetail({m, att, setMemView, update, remove, canEdit, canDelete, allMembers, openMember, limited, outside, canPray, meName, meId, specials}){
  const [pSecret, setPSecret] = useState(false);
  const visiblePrayers = (m && m.prayers ? m.prayers : []).filter(p => !limited || !p.secret);
  /* 속장·교사는 자기가 남긴 심방 기록만 봅니다 */
  const visibleVisits = (m && m.visits ? m.visits : []).filter(v => !limited || v.byId === meId);
  const [vWhen, setVWhen] = useState(nowLocal());
  const [vPurpose, setVPurpose] = useState("정기심방");
  const [vNote, setVNote] = useState("");
  const [pReq, setPReq] = useState("");

  if(!m) return <div className="panel empty">교인 정보를 찾을 수 없습니다.</div>;
  const age = calcAge(m.birth);
  const year = String(new Date().getFullYear());

  /* 기본 예배 + 특별예배. 출석 기록에만 남아 있는 예배(목록에서 뺀 것)도 함께 찾아 준다 */
  const attStat = (()=>{
    const known = [...SERVICES, ...(specials||[])];
    const knownKeys = new Set(known.map(s=>s.key));
    const extraKeys = new Set();
    Object.keys(att).forEach(d=>{
      Object.keys(att[d]||{}).forEach(k=>{
        if(!knownKeys.has(k) && (att[d][k]||[]).includes(m.id)) extraKeys.add(k);
      });
    });
    const rows = [...known, ...[...extraKeys].map(k=>({key:k, label:"지난 특별예배", from:""}))];
    return rows.map(s=>{
      const dates = Object.keys(att).filter(d => (att[d][s.key]||[]).includes(m.id)).sort();
      return {key:s.key, label:s.label, from:s.from||"",
        special:!SERVICES.some(x=>x.key===s.key),
        total:dates.length,
        year:dates.filter(d=>d.startsWith(year)).length,
        last:dates.length ? dates[dates.length-1] : null};
    }).filter(s => !s.special || s.total > 0 || String(s.from||"").startsWith(year));
       /* 특별예배: 올해 것은 0회라도 표시, 지난 해 것은 참석 기록이 있을 때만 */

  const curDepts = (m.depts||[]).filter(d=>d.current);
  const pastDepts = (m.depts||[]).filter(d=>!d.current);

  return (
    <div>
      <div className="back-line">
        <button className="btn sm ghost" onClick={()=>setMemView({mode:"list"})}>← 명부로</button>
      </div>

      <div className="panel">
        <div className="mem-detail-head">
          {m.photo && <img className="mem-photo-lg" src={m.photo} alt={m.name+" 사진"}/>}
          <div className="row" style={{justifyContent:"space-between", flex:"1 1 auto"}}>
            <h2 style={{margin:0}}>{m.name} <span className="chip pos">{m.position||"성도"}</span></h2>
            {canEdit && <div className="row" style={{gap:6}}>
              <button className="btn sm" onClick={()=>setMemView({mode:"form", id:m.id})}>정보 수정</button>

        </div>
        <div className="tbl-wrap" style={{marginTop:12}}><table>

            <tr><th style={{width:90}}>생년월일</th><td>{m.birth ? `${m.birth} (${age}세)` : <span className="muted">미입력</span>}</td></tr>
            <tr><th>속회</th><td>{sokOf(m) ? sokLabel(sokOf(m)) :
              <span className="muted">{SOK_MODE==="manual"

                : SOK_MODE==="area"

      {outside && <div className="panel" style={{padding:"12px 16px"}}>

      <div className="panel">
        <h2>가족</h2>
        {(m.family||[]).length===0 ? <p className="empty">등록된 가족이 없습니다. '정보 수정'에서 추가할 수 있습니다.</p> :

      <div className="panel">
        <h2>봉사 부서</h2>

            </div>}
            {pastDepts.length>0 && <div>
              {pastDepts.map(d=><span key={d.id} className="chip past" style={{marginRight:6}}>
                {d.name}{(d.from||d.to) && ` (${d.from||"?"}~${d.to||"?"})`}</span>)}
            </div>}
          </div>)}
      </div>

      <div className="panel">
        <h2>예배 출석 현황</h2>
        <div className="tbl-wrap"><table>
          <thead><tr><th>예배</th><th>올해 출석</th><th>누적</th><th>최근 출석일</th></tr></thead>
          <tbody>{attStat.map(s=>(
            <tr key={s.key}><td>{s.special && "✦ "}{s.label}</td>
              <td><b style={{color:"var(--pine)"}}>{s.year}</b>회</td>
              <td>{s.total}회</td>
              <td>{s.last ? `${s.last} (${weekdayOf(s.last)})` : <span className="muted">기록 없음</span>}</td></tr>))}
          </tbody></table></div>
        <p className="muted small" style={{marginBottom:0}}>출석 체크는 상단 <b>출석</b> 메뉴에서 예배별로 진행합니다.</p>
      </div>

      {(!limited || canPray) && <div className="panel">
        <h2>심방 기록 <span className="muted small">{visibleVisits.length}건</span></h2>
        {visibleVisits.length>0 &&
          <div className="tbl-wrap"><table>
            <thead><tr><th>일시</th><th>목적</th><th>내용</th><th></th></tr></thead>
            <tbody>{[...visibleVisits].sort((a,b)=>(b.when||"").localeCompare(a.when||"")).map(v=>(

                <td style={{whiteSpace:"pre-wrap"}}>{v.note}</td>

                  if(confirm("이 심방 기록을 삭제할까요?")) update(o=>({...o, visits:o.visits.filter(x=>x.id!==v.id)}));
                }}>삭제</button>}</td>

          <input type="datetime-local" value={vWhen} onChange={e=>setVWhen(e.target.value)}/>

        {(canEdit || canPray) && <React.Fragment>

            update(o=>({...o, prayers:[...(o.prayers||[]),
              {id:uid(), date:todayStr(), request:pReq.trim(), status:"open", answeredDate:"",
               secret: pSecret, by: meName, byId: meId}]}));
